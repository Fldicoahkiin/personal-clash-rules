services:
  sub-store:
    build:
      context: .
    image: flacier/sub-store:2.36.39
    restart: unless-stopped
    init: true
    read_only: true
    environment:
      SUB_STORE_CORS_ALLOWED_ORIGINS: ${SUB_STORE_CORS_ALLOWED_ORIGINS:-https://rules.flacier.com}
    expose:
      - "3000"
    volumes:
      - sub-store-data:/data
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const net=require('node:net');const socket=net.connect(3000,'127.0.0.1',()=>{socket.end();process.exit(0)});socket.on('error',()=>process.exit(1));setTimeout(()=>process.exit(1),3000)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  gateway:
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    read_only: true
    depends_on:
      sub-store:
        condition: service_healthy
    environment:
      SUB_STORE_TOKEN: ${SUB_STORE_TOKEN:?set SUB_STORE_TOKEN in .env}
    ports:
      - "127.0.0.1:${SUB_STORE_PORT:-3010}:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    tmpfs:
      - /config:size=16m
      - /data:size=16m
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - --spider
        - http://127.0.0.1:8080/healthz
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  tunnel:
    image: cloudflare/cloudflared:2026.8.2@sha256:0aa26e284f05e6c77ae375b8c9c11d9eb6a448fb7bcd8d40f31cb6176189eb38
    restart: unless-stopped
    init: true
    read_only: true
    depends_on:
      gateway:
        condition: service_healthy
    command:
      - tunnel
      - --no-autoupdate
      - run
    environment:
      TUNNEL_TOKEN_FILE: /run/secrets/cloudflare_tunnel_token
    secrets:
      - cloudflare_tunnel_token
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  sub-store-data:

secrets:
  cloudflare_tunnel_token:
    file: ${CLOUDFLARE_TUNNEL_TOKEN_FILE:-./secrets/cloudflare-tunnel-token}
