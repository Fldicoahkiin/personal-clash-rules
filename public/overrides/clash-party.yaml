+proxy-groups:
  - name: 🖐 手动选择
    type: select
    proxies:
      - ♻️ 自动选择
      - 🇺🇸 美国
      - 🇯🇵 日本
      - 🇸🇬 新加坡
      - 🇭🇰 香港
      - 🇹🇼 台湾
      - 🇰🇷 韩国
      - 🇪🇺 欧洲
    include-all: true
    exclude-type: direct
    exclude-filter: (?i)(剩余|流量|到期|官网|客服|订阅)
    empty-fallback: REJECT
  - name: 🌐 全局
    type: select
    proxies:
      - 🖐 手动选择
      - ♻️ 自动选择
      - 🇺🇸 美国
      - 🇯🇵 日本
      - 🇸🇬 新加坡
      - 🇭🇰 香港
      - 🇹🇼 台湾
      - 🇰🇷 韩国
      - 🇪🇺 欧洲
      - DIRECT
    include-all: true
    exclude-filter: (?i)(剩余|流量|到期|官网|客服|订阅)
    empty-fallback: REJECT
  - name: ♻️ 自动选择
    type: url-test
    include-all: true
    exclude-type: direct
    url: https://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 80
    exclude-filter: (?i)(剩余|流量|到期|官网|客服|订阅)
    empty-fallback: REJECT
  - name: 🇺🇸 美国
    type: select
    include-all: true
    exclude-type: direct
    filter: (?i)(🇺🇸|美国|美國|United States|Los Angeles|Seattle|San Jose|New
      York|Dallas|Chicago|(^|[ _-])(US|USA)([ _-]|$))
    exclude-filter: (?i)(剩余|流量|到期|官网|客服|订阅)
    empty-fallback: REJECT
  - name: 🇯🇵 日本
    type: select
    include-all: true
    exclude-type: direct
    filter: (?i)(🇯🇵|日本|Japan|Tokyo|Osaka|(^|[ _-])JP([ _-]|$))
    exclude-filter: (?i)(剩余|流量|到期|官网|客服|订阅)
    empty-fallback: REJECT
  - name: 🇸🇬 新加坡
    type: select
    include-all: true
    exclude-type: direct
    filter: (?i)(🇸🇬|新加坡|Singapore|(^|[ _-])SG([ _-]|$))
    exclude-filter: (?i)(剩余|流量|到期|官网|客服|订阅)
    empty-fallback: REJECT
  - name: 🇭🇰 香港
    type: select
    include-all: true
    exclude-type: direct
    filter: (?i)(🇭🇰|香港|Hong Kong|(^|[ _-])HK([ _-]|$))
    exclude-filter: (?i)(剩余|流量|到期|官网|客服|订阅)
    empty-fallback: REJECT
  - name: 🇹🇼 台湾
    type: select
    include-all: true
    exclude-type: direct
    filter: (?i)(🇹🇼|台湾|台灣|Taiwan|Taipei|(^|[ _-])TW([ _-]|$))
    exclude-filter: (?i)(剩余|流量|到期|官网|客服|订阅)
    empty-fallback: REJECT
  - name: 🇰🇷 韩国
    type: select
    include-all: true
    exclude-type: direct
    filter: (?i)(🇰🇷|韩国|韓國|South Korea|Seoul|(^|[ _-])KR([ _-]|$))
    exclude-filter: (?i)(剩余|流量|到期|官网|客服|订阅)
    empty-fallback: REJECT
  - name: 🇪🇺 欧洲
    type: select
    include-all: true
    exclude-type: direct
    filter: (?i)(🇬🇧|🇩🇪|🇫🇷|🇳🇱|🇮🇹|🇪🇸|🇨🇭|🇪🇺|英国|英國|United
      Kingdom|London|德国|德國|Germany|Frankfurt|法国|法國|France|Paris|荷兰|荷蘭|Netherlands|Amsterdam|意大利|Italy|西班牙|Spain|瑞士|Switzerland|(^|[
      _-])(UK|GB|DE|FR|NL|IT|ES|CH|EU)([ _-]|$))
    exclude-filter: (?i)(剩余|流量|到期|官网|客服|订阅)
    empty-fallback: REJECT
  - name: 🤖 AI
    type: select
    proxies:
      - 🌐 全局
      - 🇺🇸 美国
      - 🇯🇵 日本
      - 🇸🇬 新加坡
      - 🇹🇼 台湾
    empty-fallback: REJECT
  - name: 🍎 Apple
    type: select
    proxies:
      - 🌐 全局
      - DIRECT
      - 🇺🇸 美国
      - 🇯🇵 日本
      - 🇸🇬 新加坡
    empty-fallback: REJECT
  - name: 🎮 Steam
    type: select
    proxies:
      - 🌐 全局
      - DIRECT
      - 🇯🇵 日本
      - 🇺🇸 美国
      - 🇸🇬 新加坡
    empty-fallback: REJECT
  - name: 📥 Steam 下载
    type: select
    proxies:
      - 🌐 全局
      - DIRECT
      - 🇯🇵 日本
      - 🇺🇸 美国
      - 🇸🇬 新加坡
      - 🇭🇰 香港
      - 🇹🇼 台湾
    empty-fallback: REJECT
  - name: 🕹️ Steam 联机
    type: select
    proxies:
      - 🌐 全局
      - DIRECT
      - 🇯🇵 日本
      - 🇺🇸 美国
      - 🇸🇬 新加坡
      - 🇭🇰 香港
      - 🇹🇼 台湾
    empty-fallback: REJECT
  - name: 💬 Discord
    type: select
    proxies:
      - 🌐 全局
      - 🇺🇸 美国
      - 🇯🇵 日本
      - 🇸🇬 新加坡
      - DIRECT
    empty-fallback: REJECT
  - name: 🛠️ 开发服务
    type: select
    proxies:
      - 🌐 全局
      - DIRECT
      - 🇺🇸 美国
      - 🇯🇵 日本
      - 🇸🇬 新加坡
    empty-fallback: REJECT
  - name: 🎬 流媒体
    type: select
    proxies:
      - 🌐 全局
      - 🇺🇸 美国
      - 🇯🇵 日本
      - 🇸🇬 新加坡
      - DIRECT
    empty-fallback: REJECT
  - name: 📺 哔哩哔哩
    type: select
    proxies:
      - 🌐 全局
      - DIRECT
      - 🇭🇰 香港
      - 🇹🇼 台湾
      - 🇸🇬 新加坡
    empty-fallback: REJECT
  - name: 📺 巴哈姆特
    type: select
    proxies:
      - 🇹🇼 台湾
      - 🌐 全局
      - DIRECT
      - ♻️ 自动选择
    empty-fallback: REJECT
  - name: 💬 社交
    type: select
    proxies:
      - 🌐 全局
      - 🇺🇸 美国
      - 🇯🇵 日本
      - 🇸🇬 新加坡
      - DIRECT
    empty-fallback: REJECT
  - name: 🐟 未匹配流量
    type: select
    proxies:
      - 🌐 全局
      - DIRECT
      - ♻️ 自动选择
    empty-fallback: REJECT

+rules:
  - RULE-SET,private-domain,DIRECT
  - RULE-SET,private-ip,DIRECT,no-resolve
  - RULE-SET,tencent-messaging,DIRECT
  - RULE-SET,netease-music,DIRECT
  - RULE-SET,apple-system,🍎 Apple
  - RULE-SET,apple-services,🍎 Apple
  - PROCESS-NAME-REGEX,(?i)^codex(\.exe)?$,🤖 AI
  - PROCESS-NAME-REGEX,(?i)^claude(\.exe)?$,🤖 AI
  - RULE-SET,ai-openai,🤖 AI
  - RULE-SET,ai-anthropic,🤖 AI
  - RULE-SET,ai-xai,🤖 AI
  - RULE-SET,ai-google,🤖 AI
  - RULE-SET,ai-coding,🤖 AI
  - RULE-SET,ai-general,🤖 AI
  - RULE-SET,steam-download,📥 Steam 下载
  - RULE-SET,steam-online,🕹️ Steam 联机
  - RULE-SET,steam,🎮 Steam
  - RULE-SET,discord,💬 Discord
  - RULE-SET,developer,🛠️ 开发服务
  - RULE-SET,bilibili,📺 哔哩哔哩
  - RULE-SET,anigamer,📺 巴哈姆特
  - RULE-SET,media,🎬 流媒体
  - RULE-SET,social,💬 社交
  - RULE-SET,ai-anthropic-ip,🤖 AI,no-resolve
  - MATCH,🐟 未匹配流量
