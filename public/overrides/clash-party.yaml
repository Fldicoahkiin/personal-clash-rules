+proxy-groups:
  - name: 🖐 手动选择
    type: select
    proxies:
      - ♻️ 自动选择
      - 🇺🇸 美国
      - 🇯🇵 日本
      - 🇸🇬 新加坡
      - 🇭🇰 香港
      - 🇹🇼 台湾
      - 🇰🇷 韩国
      - 🇪🇺 欧洲
      - DIRECT
    include-all: true
    exclude-filter: (?i)(剩余|流量|到期|官网|客服|订阅)
    empty-fallback: REJECT
  - name: GLOBAL
    type: select
    proxies:
      - 🖐 手动选择
      - ♻️ 自动选择
      - 🇺🇸 美国
      - 🇯🇵 日本
      - 🇸🇬 新加坡
      - 🇭🇰 香港
      - 🇹🇼 台湾
      - 🇰🇷 韩国
      - 🇪🇺 欧洲
      - DIRECT
    include-all: true
    exclude-filter: (?i)(剩余|流量|到期|官网|客服|订阅)
    empty-fallback: REJECT
  - name: ♻️ 自动选择
    type: url-test
    include-all: true
    exclude-type: direct
    url: https://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 80
    exclude-filter: (?i)(剩余|流量|到期|官网|客服|订阅)
    empty-fallback: REJECT
  - name: 🇺🇸 美国
    type: select
    include-all: true
    exclude-type: direct
    filter: (?i)(🇺🇸|美国|美國|United States|Los Angeles|Seattle|San Jose|New York|Dallas|Chicago|(^|[ _-])(US|USA)([ _-]|$))
    exclude-filter: (?i)(剩余|流量|到期|官网|客服|订阅)
    empty-fallback: REJECT
  - name: 🇯🇵 日本
    type: select
    include-all: true
    exclude-type: direct
    filter: (?i)(🇯🇵|日本|Japan|Tokyo|Osaka|(^|[ _-])JP([ _-]|$))
    exclude-filter: (?i)(剩余|流量|到期|官网|客服|订阅)
    empty-fallback: REJECT
  - name: 🇸🇬 新加坡
    type: select
    include-all: true
    exclude-type: direct
    filter: (?i)(🇸🇬|新加坡|Singapore|(^|[ _-])SG([ _-]|$))
