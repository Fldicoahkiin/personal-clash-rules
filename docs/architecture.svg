<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title description">
  <title id="title">Flacier subscription conversion architecture</title>
  <desc id="description">GitHub deploys the Cloudflare Worker. The Worker stores encrypted sources and generated outputs in D1, calls a private Sub-Store service, and publishes stable links for subscription clients.</desc>
  <style>
    .paper { fill: #faf8f4; }
    .panel { fill: #faf8f4; stroke: #091e37; stroke-width: 1.5; }
    .selected { fill: #d3e4e1; stroke: #085f68; stroke-width: 1.5; }
    .ink { fill: #091e37; font-family: Arial, "PingFang SC", sans-serif; }
    .muted { fill: #4a5e6e; font-family: Arial, "PingFang SC", sans-serif; }
    .accent { fill: #085f68; font-family: Arial, "PingFang SC", sans-serif; }
    .mono { font-family: "SFMono-Regular", Consolas, monospace; }
    .line { fill: none; stroke: #b6c5c8; stroke-width: 1.5; }
    .rail { fill: none; stroke: #085f68; stroke-width: 2; }
    .label { font-size: 12px; font-weight: 700; letter-spacing: 1.5px; }
    .title { font-size: 29px; font-weight: 700; }
    .node-title { font-size: 17px; font-weight: 700; }
    .body { font-size: 13px; }
    .small { font-size: 11px; }
  </style>

  <rect class="paper" width="1200" height="560" />
  <text x="48" y="48" class="ink title">订阅转换</text>
  <text x="48" y="75" class="muted body">GitHub 推送 · Worker 转换 · 固定订阅链接</text>
  <text x="1152" y="52" text-anchor="end" class="accent mono label">FLACIER / 2026</text>
  <line x1="48" y1="98" x2="1152" y2="98" class="line" />

  <line x1="141" y1="238" x2="1061" y2="238" class="rail" />
  <line x1="141" y1="246" x2="1061" y2="246" class="rail" />

  <g>
    <text x="141" y="135" text-anchor="middle" class="muted mono label">SOURCE</text>
    <rect x="48" y="155" width="186" height="72" class="panel" />
    <text x="141" y="184" text-anchor="middle" class="ink node-title">GitHub</text>
    <text x="141" y="207" text-anchor="middle" class="muted mono small">main · rules · UI</text>
    <circle cx="141" cy="242" r="10" class="paper" stroke="#085f68" stroke-width="3" />
  </g>

  <g>
    <text x="371" y="135" text-anchor="middle" class="muted mono label">CONTROL</text>
    <rect x="278" y="155" width="186" height="72" class="selected" />
    <text x="371" y="184" text-anchor="middle" class="ink node-title">Worker + D1</text>
    <text x="371" y="207" text-anchor="middle" class="muted small">加密来源 · 生成结果</text>
    <circle cx="371" cy="242" r="10" fill="#085f68" />
  </g>

  <g>
    <text x="601" y="135" text-anchor="middle" class="muted mono label">CONVERT</text>
    <rect x="508" y="155" width="186" height="72" class="panel" />
    <text x="601" y="184" text-anchor="middle" class="ink node-title">Sub-Store</text>
    <text x="601" y="207" text-anchor="middle" class="muted mono small">2.36.39 · private VPS</text>
    <circle cx="601" cy="242" r="10" class="paper" stroke="#085f68" stroke-width="3" />
  </g>

  <g>
    <text x="831" y="135" text-anchor="middle" class="muted mono label">PUBLISH</text>
    <rect x="738" y="155" width="186" height="72" class="panel" />
    <text x="831" y="184" text-anchor="middle" class="ink node-title">固定链接</text>
    <text x="831" y="207" text-anchor="middle" class="muted mono small">/s/:token/:target</text>
    <circle cx="831" cy="242" r="10" class="paper" stroke="#085f68" stroke-width="3" />
  </g>

  <g>
    <text x="1061" y="135" text-anchor="middle" class="muted mono label">CLIENT</text>
    <rect x="968" y="155" width="184" height="72" class="panel" />
    <text x="1060" y="184" text-anchor="middle" class="ink node-title">13 种格式</text>
    <text x="1060" y="207" text-anchor="middle" class="muted small">Mihomo · Surge · sing-box</text>
    <circle cx="1061" cy="242" r="10" class="paper" stroke="#085f68" stroke-width="3" />
  </g>

  <text x="486" y="274" text-anchor="middle" class="accent mono small">BEARER TOKEN</text>

  <line x1="601" y1="252" x2="601" y2="346" class="line" />
  <circle cx="601" cy="346" r="6" fill="#091e37" />
  <rect x="466" y="366" width="270" height="76" class="panel" />
  <text x="601" y="395" text-anchor="middle" class="ink node-title">订阅源与单个节点</text>
  <text x="601" y="419" text-anchor="middle" class="muted small">机场订阅 · 3x-ui · URI</text>

  <line x1="48" y1="478" x2="1152" y2="478" class="line" />
  <text x="48" y="511" class="muted mono small">RULES</text>
  <text x="112" y="511" class="ink body">规则文件由 Worker 直接发布；Mihomo 覆写单独导入。</text>
  <text x="1152" y="511" text-anchor="end" class="muted body">节点流量不经过 Worker</text>
</svg>
